<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鉄道のひろがり</title>
<meta name="description" content="新橋開業から現在まで、首都圏の鉄道が広がっていく様子を地図で見る">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--ink:#2b2118;--sub:#6b5a44;--paper:#fbf6ea;--edge:#d8ccb0;--red:#c62828}
html,body{margin:0;height:100%;font-family:"Yu Gothic UI",Meiryo,"Hiragino Sans",sans-serif;background:#e8e2d2;color:var(--ink);overflow:hidden}
#map{position:absolute;inset:0}
.card{position:absolute;z-index:1000;left:12px;right:12px;bottom:16px;max-width:640px;margin:auto;background:var(--paper);border:1px solid var(--edge);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.25);padding:10px 14px;max-height:62vh;overflow:auto;box-sizing:border-box}
.head{display:flex;align-items:flex-end;gap:10px}
#year{font-size:34px;font-weight:700;line-height:1}
#era{font-size:15px;color:var(--sub)}
#count{margin-left:auto;font-size:12px;text-align:right}
#spark{width:130px;height:32px;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--red)}
button,select,input[type=text]{font:inherit;font-size:14px;padding:4px 9px;border:1px solid #bfae8a;border-radius:6px;background:#fff;color:var(--ink)}
button{cursor:pointer}
button.on{background:#1f4e79;color:#fff;border-color:#1f4e79}
#play{font-size:16px;width:44px}
label{font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
input[type=text]{width:8.5em}
#news{font-size:12px;color:var(--red);margin-top:6px;max-height:3.6em;overflow:auto}
#drawer{display:none;border-top:1px dashed var(--edge);margin-top:8px}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px}
#msg{position:absolute;z-index:1003;top:12px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:14px;max-width:90%}
#bgNote{position:absolute;z-index:999;left:10px;top:10px;background:rgba(251,246,234,.92);border:1px solid var(--edge);border-radius:6px;padding:3px 8px;font-size:12px;display:none}
#gogai{position:absolute;z-index:1001;top:12px;left:50%;transform:translate(-50%,-170%);transition:transform .45s;background:var(--paper);border:3px double var(--ink);padding:5px 12px 5px 46px;max-width:min(420px,80vw);font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.25);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
#gogai.show{transform:translate(-50%,0)}
#gogai .stamp{position:absolute;left:8px;top:50%;transform:translateY(-50%) rotate(-8deg);background:var(--red);color:#fff;font-weight:700;padding:4px 4px;font-size:13px;writing-mode:vertical-rl;letter-spacing:2px;white-space:nowrap}
#gogai b{display:block;font-size:11px;color:var(--sub)}
.train{font-size:18px;line-height:18px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pulse{width:30px;height:30px;border-radius:50%;border:4px solid var(--red);box-sizing:border-box;animation:pl 1.2s infinite}
@keyframes pl{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.7);opacity:0}}
.lbl span{position:absolute;white-space:nowrap;font-size:11px;color:#222;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.cardS{font-size:13px;line-height:1.55}
.cardS .cn{font-size:17px;font-weight:700}
.cardS .cl{font-size:11px;color:var(--sub);margin-bottom:4px}
.cardS button{font-size:12px;padding:3px 7px}
#quiz,#story,#cmp{display:none}
#qName{font-size:24px;font-weight:700;margin-top:4px}
#qLine{font-size:12px;color:var(--sub)}
#qYear{font-size:30px;font-weight:700}
#qRes,#sText{font-size:14px;margin-top:6px;min-height:1.2em;line-height:1.6}
#divider{position:absolute;z-index:998;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);display:none;cursor:ew-resize;touch-action:none}
#divider .knob{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#1f4e79;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.cmpTag{position:absolute;z-index:999;top:10px;background:rgba(31,78,121,.9);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;display:none;max-width:calc(50vw - 66px)}
#tagA{left:10px}#tagB{right:54px}
</style></head><body>
<div id="map"></div>
<div id="msg">線路データを読み込み中…</div>
<div id="bgNote"></div>
<div id="gogai"><span class="stamp">号外</span><b id="gEra"></b><span id="gText"></span></div>
<div id="divider"><div class="knob">⇔</div></div>
<div id="tagA" class="cmpTag"></div><div id="tagB" class="cmpTag"></div>

<div id="panel" class="card">
  <div class="head">
    <div><span id="year">1872</span> <span id="era"></span></div>
    <div id="count"><canvas id="spark"></canvas><span id="cnt"></span></div>
  </div>
  <div class="row">
    <button id="play" title="再生">▶</button>
    <button id="back10" title="10年もどる">−10</button>
    <input type="range" id="slider" min="1872" value="1872">
    <button id="fwd10" title="10年すすむ">+10</button>
    <select id="speed"><option value="900">ゆっくり</option><option value="450" selected>ふつう</option><option value="180">はやい</option></select>
  </div>
  <div class="row">
    <input type="text" id="q" list="names" placeholder="駅名で検索">
    <button id="find">🔍</button>
    <button id="quizBtn">🎓 クイズ</button>
    <button id="storyBtn">📖 ものがたり</button>
    <button id="cmpBtn">↔ 比べる</button>
    <button id="optBtn">⚙ 表示</button>
  </div>
  <div id="drawer">
    <div class="row" id="chips"></div>
    <div class="row">
      <label><input type="checkbox" id="o_emph"> 変化を強調</label>
      <label><input type="checkbox" id="o_ghost"> 廃線の幽霊</label>
      <label><input type="checkbox" id="o_follow"> カメラが追う</label>
      <label><input type="checkbox" id="o_gogai"> 号外</label>
      <label><input type="checkbox" id="o_sound"> 音</label>
    </div>
    <div class="row">
      <label>背景 <select id="o_bg"><option value="pale">淡色地図</option><option value="photo">時代の空中写真</option></select></label>
      <label>時代へ <select id="eraJump"></select></label>
    </div>
  </div>
  <div id="news"></div>
  <datalist id="names"></datalist>
  <datalist id="lineNames"></datalist>
</div>

<div id="quiz" class="card">
  <div class="head"><div id="qHead"></div><div id="qScore" style="margin-left:auto"></div></div>
  <div id="qName"></div><div id="qLine"></div>
  <div id="qAsk">
    <div><span id="qYear"></span> <span id="qEra"></span></div>
    <div class="row"><input type="range" id="qSlider" min="1872" value="1930"><button id="qGo">これだ！</button></div>
  </div>
  <div id="qRes"></div>
  <div class="row"><button id="qNext" style="display:none">次へ</button><button id="qQuit" style="margin-left:auto">やめる</button></div>
</div>

<div id="story" class="card">
  <div id="sPick">
    <div style="font-weight:700">📖 路線ものがたり</div>
    <div style="font-size:12px;color:var(--sub)">路線名を選ぶと、その路線が伸びていく様子を順番にたどります</div>
    <div class="row"><input type="text" id="sLine" list="lineNames" placeholder="例：中央本線" style="width:12em"><button id="sGo">はじめる</button><button id="sCancel" style="margin-left:auto">閉じる</button></div>
  </div>
  <div id="sMain" style="display:none">
    <div class="head"><b id="sTitle" style="font-size:17px"></b><span id="sCount" style="margin-left:auto;font-size:12px"></span></div>
    <div id="sText"></div>
    <div class="row"><button id="sPrev">◀ 前</button><button id="sAuto">▶ 自動</button><button id="sNext">次 ▶</button><button id="sQuit" style="margin-left:auto">閉じる</button></div>
  </div>
</div>

<div id="cmp" class="card">
  <div style="font-weight:700">↔ 2つの年を比べる <span style="font-size:12px;font-weight:400;color:var(--sub)">（地図の白い線を左右にドラッグ）</span></div>
  <div class="row"><span style="width:3.5em">左 <b id="cA"></b></span><input type="range" id="cmpA" min="1872"></div>
  <div class="row"><span style="width:3.5em">右 <b id="cB"></b></span><input type="range" id="cmpB" min="1872"></div>
  <div class="row"><button id="cmpQuit" style="margin-left:auto">閉じる</button></div>
</div>

<script src="app.js"></script>
</body></html>
